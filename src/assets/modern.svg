<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <!-- Motivos de la Era Moderna, muy tenues: rascacielos, un átomo, un cohete con su estela, líneas
       de circuito, un satélite, un molino de viento y una cenefa de puntos y trazos -->
  <g opacity=".1" fill="none" stroke="#0e3a7a" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cenefa de circuito arriba y abajo -->
    <g stroke-width="3">
      <path d="M0 22h60l10-10h60l10 10h110M390 618h110l10-10h60l10 10h60"/>
      <path d="M60 22a4 4 0 1 1 0 .1M190 22a4 4 0 1 1 0 .1M500 618a4 4 0 1 1 0 .1M580 618a4 4 0 1 1 0 .1"/>
    </g>

    <!-- Rascacielos -->
    <g transform="translate(470 200)" stroke-width="4">
      <path d="M-120 100V-10h40v110M-80 100V-90l25-20 25 20v190M-30 100V-40h50v140M20 100V20h40v80"/>
      <path d="M-55-110v-30M-70-60h30M-70-30h30M-70 0h30M-70 30h30M-20-20h30M-20 10h30M-20 40h30M-110 10h20M-110 40h20"/>
    </g>

    <!-- Átomo -->
    <g transform="translate(140 320)" stroke-width="4">
      <ellipse rx="70" ry="24"/>
      <ellipse rx="70" ry="24" transform="rotate(60)"/>
      <ellipse rx="70" ry="24" transform="rotate(-60)"/>
      <circle r="8"/>
    </g>

    <!-- Cohete con su estela -->
    <g transform="translate(340 470) rotate(30)" stroke-width="4">
      <path d="M0-80c20 18 26 50 22 90h-44c-4-40 2-72 22-90z"/>
      <circle cy="-30" r="9"/>
      <path d="M-22-6l-20 30v12l20-10M22-6l20 30v12l-20-10M-10 14c-6 30 4 60 10 80 6-20 16-50 10-80"/>
    </g>

    <!-- Satélite -->
    <g transform="translate(520 430)" stroke-width="4">
      <path d="M-14-14h28v28h-28zM-14 0h-50M14 0h50M-64-18v36h-30v-36zM64-18v36h30v-36zM0-14v-18M-8-40a12 12 0 0 1 16 0"/>
    </g>

    <!-- Molino de viento -->
    <g transform="translate(110 520)" stroke-width="4">
      <path d="M-4 100L-2-40h4L4 100M0-40l-8-70M0-40l64 30M0-40l-56 40"/>
      <circle cy="-40" r="6"/>
    </g>

    <!-- Líneas de circuito -->
    <g stroke-width="3">
      <path d="M40 140h60l20 20v60M600 300h-40l-20-20v-60"/>
      <path d="M120 220a5 5 0 1 1 0 .1M540 220a5 5 0 1 1 0 .1"/>
    </g>
  </g>
</svg>
