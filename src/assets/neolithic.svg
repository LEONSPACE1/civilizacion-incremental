<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <!-- Motivos del Neolítico, muy tenues: bandas en zigzag de la cerámica, impresiones de
       concha (cardial), espirales, espigas de trigo, cabras pintadas y vasijas -->
  <g opacity=".11" fill="none" stroke="#9a4422" stroke-linecap="round" stroke-linejoin="round">
    <!-- Banda incisa en zigzag con filas de puntos -->
    <path stroke-width="4" d="M20 70l22-24 22 24 22-24 22 24 22-24 22 24 22-24 22 24"/>
    <path stroke-width="4" d="M20 92l22-24 22 24 22-24 22 24 22-24 22 24 22-24 22 24"/>
    <g fill="#9a4422" stroke="none">
      <circle cx="31" cy="112" r="3.2"/><circle cx="53" cy="112" r="3.2"/><circle cx="75" cy="112" r="3.2"/><circle cx="97" cy="112" r="3.2"/>
      <circle cx="119" cy="112" r="3.2"/><circle cx="141" cy="112" r="3.2"/><circle cx="163" cy="112" r="3.2"/><circle cx="185" cy="112" r="3.2"/>
      <circle cx="207" cy="112" r="3.2"/>
    </g>

    <!-- Espiral -->
    <path stroke-width="4.5" d="M470 120c0-6 8-8 12-4 6 6 2 16-6 18-12 3-22-6-20-18 2-16 20-24 34-18 18 8 22 30 12 44-12 17-38 18-52 4"/>

    <!-- Vasija con decoración de espiga -->
    <g transform="translate(330 260)">
      <path stroke-width="4" d="M-34-50h68M-30-50c-22 18-30 48-20 74 8 20 24 30 50 30s42-10 50-30c10-26 2-56-20-74"/>
      <path stroke-width="3" d="M-36-22l12 10 12-10 12 10 12-10 12 10 12-10M-40 2l12 10 12-10 12 10 12-10 12 10 12-10 12 10"/>
      <g fill="#9a4422" stroke="none"><circle cx="-20" cy="30" r="2.6"/><circle cx="-8" cy="34" r="2.6"/><circle cx="4" cy="35" r="2.6"/><circle cx="16" cy="33" r="2.6"/><circle cx="28" cy="29" r="2.6"/></g>
    </g>

    <!-- Espigas de trigo -->
    <g stroke-width="3.5" transform="translate(110 360)">
      <path d="M0 110V0M0 14c-12-4-14-14-12-22 10 2 14 12 12 22zM0 14c12-4 14-14 12-22-10 2-14 12-12 22zM0 36c-12-4-14-14-12-22 10 2 14 12 12 22zM0 36c12-4 14-14 12-22-10 2-14 12-12 22zM0 58c-12-4-14-14-12-22 10 2 14 12 12 22zM0 58c12-4 14-14 12-22-10 2-14 12-12 22z"/>
      <path d="M40 120V20M40 34c-10-4-12-12-10-20 8 2 12 10 10 20zM40 34c10-4 12-12 10-20-8 2-12 10-10 20zM40 54c-10-4-12-12-10-20 8 2 12 10 10 20zM40 54c10-4 12-12 10-20-8 2-12 10-10 20z"/>
    </g>

    <!-- Cabras pintadas al estilo levantino -->
    <g fill="#9a4422" stroke="none" transform="translate(470 470)">
      <path d="M0 0c10-6 34-6 44 0l6-10 4 2-4 12 2 18h-6l-3-14c-10 3-22 3-32 0l-4 14h-6l2-18c-6-2-8-6-6-10z"/>
      <path d="M50-10c2-10-4-20-12-24 10 0 18 8 16 22z"/>
      <path transform="translate(-90 30) scale(.8)" d="M0 0c10-6 34-6 44 0l6-10 4 2-4 12 2 18h-6l-3-14c-10 3-22 3-32 0l-4 14h-6l2-18c-6-2-8-6-6-10z"/>
    </g>

    <!-- Sol de círculos concéntricos -->
    <g transform="translate(560 300)" stroke-width="4">
      <circle r="10" fill="#9a4422" stroke="none"/><circle r="22"/><circle r="34" stroke-dasharray="3 9"/>
    </g>

    <!-- Chevrones sueltos -->
    <path stroke-width="4" d="M210 560l20-18 20 18M250 560l20-18 20 18M290 560l20-18 20 18"/>
    <path stroke-width="4" d="M40 230l18 18 18-18 18 18 18-18"/>
    <g fill="#9a4422" stroke="none"><circle cx="58" cy="266" r="3"/><circle cx="76" cy="266" r="3"/><circle cx="94" cy="266" r="3"/></g>
  </g>
</svg>
