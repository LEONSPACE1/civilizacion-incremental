<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>De la Chispa a las Estrellas</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>" />
  </head>
  <body>
    <main class="app">
      <div class="stage">
        <header class="header">
          <div>
            <h1>De la Chispa a las Estrellas</h1>
            <p class="era">Era 1 · Paleolítico</p>
          </div>
          <div class="sound-controls">
            <button id="mute" class="icon-btn" aria-label="Silenciar sonido" title="Silenciar sonido">🔊</button>
            <input id="volume" type="range" min="0" max="1" step="0.05" aria-label="Volumen" />
          </div>
        </header>

        <section class="scene" id="scene">
          <div class="hud" id="hud"></div>
          <button id="gather" class="gather">Recolectar bayas <span id="gather-amount">+1</span></button>
          <p class="no-3d-msg">Tu navegador no puede mostrar la aldea en 3D, pero el juego funciona igual.</p>
        </section>
      </div>

      <aside class="sidebar">
        <section class="panel">
          <h2>Tu tribu</h2>
          <div id="buildings" class="list"></div>
        </section>
        <section class="panel">
          <h2>Mejoras</h2>
          <div id="upgrades" class="list"></div>
          <p id="no-upgrades" class="empty">Sigue haciendo crecer tu tribu para descubrir mejoras.</p>
          <p id="owned-upgrades" class="owned"></p>
        </section>

        <section class="panel goal" id="goal"></section>

        <footer class="footer">
          <button id="export" class="link">Exportar partida</button>
          <button id="import" class="link">Importar partida</button>
          <button id="reset" class="link danger">Reiniciar</button>
          <span id="save-status" class="save-status"></span>
        </footer>
      </aside>
      <p id="toast" class="toast" role="status"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
